t": [], "logs": [], "created": "2026-09-21", "updated": ""}];const KEY='asir-control-v2';const STATUSES=['Backlog','To Do','In Progress','Done'];const PRIORITIES=['Alta','Media','Baja'];const today=()=>new Date().toLocaleDateString('en-CA');let tasks,view='dashboard',filter='',cat='',priority='',timer=null,started=0,timerTask='';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(){try{let a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a:SEED}catch{return SEED}}tasks=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));document.title='ASIR Control · Guardado'}catch(e){alert('No se ha podido guardar en este navegador. Exporta una copia JSON. '+e.message)}}function num(n){return Number(n||0).toLocaleString('es-ES',{maximumFractionDigits:1})}function total(arr,k){return arr.reduce((s,t)=>s+Number(t[k]||0),0)}function done(){return tasks.filter(t=>t.status==='Done').length}function overdue(t){return t.due&&t.due<today()&&t.status!=='Done'}function categories(){return [...new Set(tasks.map(t=>t.category))].sort()}function filtered(){return tasks.filter(t=>(!filter||[t.id,t.title,t.description,t.notes,t.category].join(' ').toLowerCase().includes(filter.toLowerCase()))&&(!cat||t.category===cat)&&(!priority||t.priority===priority))}function datefmt(s){if(!s)return 'Sin fecha';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}function metric(label,value,sub,progress){return `<div class="metric"><small>${label}</small><strong>${value}</strong><span>${sub}</span>${progress===undefined?'':`<div class="progress"><i style="width:${Math.max(0,Math.min(100,progress))}%"></i></div>`}</div>`}function controls(){return `<div class="toolbar"><input class="field search" id="q" placeholder="Buscar por título, ID, descripción…" value="${esc(filter)}"><select class="field" id="cat"><option value="">Todas las categorías</option>${categories().map(c=>`<option ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="field" id="priority"><option value="">Todas las prioridades</option>${PRIORITIES.map(p=>`<option ${priority===p?'selected':''}>${p}</option>`).join('')}</select><button class="btn" id="clear">Limpiar</button></div>`}function card(t){return `<article class="task" draggable="true" data-id="${esc(t.id)}" tabindex="0"><div class="meta"><span class="tag">${esc(t.id)}</span><span class="tag ${esc(t.priority)}">${esc(t.priority)}</span></div><h3>${esc(t.title)}</h3><p>${esc(t.description).slice(0,125)}${t.description.length>125?'…':''}</p><div class="meta"><span class="tag">${esc(t.category)}</span></div><div class="sub"><span class="${overdue(t)?'overdue':''}">◷ ${datefmt(t.due)}</span><span>${num(t.spent)} / ${num(t.estimate)} h</span></div></article>`}function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let titles={dashboard:'Visión general',board:'Tablero Kanban',list:'Inventario de tareas',timeline:'Calendario y plazos',time:'Registro de tiempo',settings:'Datos y respaldo'};document.getElementById('heading').textContent=titles[view];let a=document.getElementById('appview');if(view==='dashboard'){let d=done(),n=tasks.length,est=total(tasks,'estimate'),spent=total(tasks,'spent'),late=tasks.filter(overdue).length;a.innerHTML=`<div class="metrics">${metric('Progreso total',`${d} / ${n}`,`${num(n?d/n*100:0)} % completado`,n?d/n*100:0)}${metric('Horas registradas',`${num(spent)} h`,`${num(est)} h estimadas`,est?spent/est*100:0)}${metric('Tareas en curso',tasks.filter(t=>t.status==='In Progress').length,'Trabajo activo')}${metric('Plazos vencidos',late,'Pendientes fuera de fecha')}</div><div class="grid2"><section class="panel"><h2>Avance por área</h2>${categories().map(c=>{let x=tasks.filter(t=>t.category===c),z=x.filter(t=>t.status==='Done').length;return `<div class="phase"><div class="phasehead"><span>${esc(c)}</span><span>${z}/${x.length}</span></div><div class="progress"><i style="width:${100*z/x.length}%"></i></div></div>`}).join('')}</section><section class="panel"><h2>Próximas fechas límite</h2>${tasks.filter(t=>t.status!=='Done'&&t.due).sort((x,y)=>x.due.localeCompare(y.due)).slice(0,8).map(t=>`<div class="log click" data-open="${t.id}"><b>${esc(t.title)}</b><br><span class="${overdue(t)?'overdue':''}">${datefmt(t.due)} · ${esc(t.priority)} · ${esc(t.status)}</span></div>`).join('')||'<p>Sin plazos pendientes.</p>'}</section></div><div class="notice" style="margin-top:16px">Las fechas iniciales son una planificación orientativa; las horas realizadas empiezan en cero y solo aumentan cuando registras trabajo. Los datos se guardan en este navegador. Exporta JSON periódicamente para disponer de una copia recuperable.</div>`}else if(view==='board'){a.innerHTML=controls()+`<div class="board">${STATUSES.map(s=>{let ts=filtered().filter(t=>t.status===s);return `<section class="lane" data-lane="${s}"><div class="lanehead">${s}<span class="count">${ts.length}</span></div>${ts.map(card).join('')||'<div class="empty">Arrastra tareas aquí</div>'}</section>`}).join('')}</div>`}else if(view==='list'){a.innerHTML=controls()+`<section class="panel tablewrap"><table class="tbl"><thead><tr><th>ID</th><th>Tarea</th><th>Fase</th><th>Estado</th><th>Prioridad</th><th>Fecha límite</th><th>Horas</th></tr></thead><tbody>${filtered().map(t=>`<tr class="click" data-open="${t.id}"><td>${esc(t.id)}</td><td><b>${esc(t.title)}</b></td><td>${esc(t.category)}</td><td>${esc(t.status)}</td><td><span class="tag ${esc(t.priority)}">${esc(t.priority)}</span></td><td class="${overdue(t)?'overdue':''}">${datefmt(t.due)}</td><td>${num(t.spent)} / ${num(t.estimate)}</td></tr>`).join('')}</tbody></table></section>`}else if(view==='timeline'){a.innerHTML=controls()+`<section class="panel"><h2>Planificación por fecha límite</h2><div class="tablewrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Tarea</th><th>Estado</th><th>Prioridad</th><th>Estimación</th></tr></thead><tbody>${filtered().sort((x,y)=>(x.due||'9999').localeCompare(y.due||'9999')).map(t=>`<tr class="click" data-open="${t.id}"><td class="${overdue(t)?'overdue':''}">${datefmt(t.due)}</td><td>${esc(t.title)}</td><td>${esc(t.status)}</td><td>${esc(t.priority)}</td><td>${num(t.estimate)} h</td></tr>`).join('')}</tbody></table></div></section>`}else if(view==='time'){let logs=tasks.flatMap(t=>(t.logs||[]).map(l=>({...l,task:t.title,id:t.id}))).sort((x,y)=>y.date.localeCompare(x.date));a.innerHTML=`<div class="metrics">${metric('Tiempo total',num(total(tasks,'spent'))+' h','Registrado manualmente o con cronómetro')}${metric('Estimación total',num(total(tasks,'estimate'))+' h','Carga prevista')}${metric('Tareas con tiempo',tasks.filter(t=>t.spent>0).length,'Con al menos una sesión')}${metric('Sesiones registradas',logs.length,'Entradas del historial')}</div><section class="panel"><h2>Historial de sesiones</h2>${logs.slice(0,100).map(l=>`<div class="log click" data-open="${l.id}"><b>${esc(l.task)}</b> · ${num(l.hours)} h · ${datefmt(l.date)}<br>${esc(l.note||'Sin observaciones')}</div>`).join('')||'<p>Aún no hay sesiones registradas. Abre una tarea y registra tiempo.</p>'}</section>`}else{a.innerHTML=`<div class="grid2"><section class="panel"><h2>Guardar y recuperar</h2><p>La información se guarda automáticamente en el almacenamiento local de este navegador y este perfil. No se sincroniza entre dispositivos ni está alojada en un servidor.</p><div class="actions"><button class="btn primary" id="exportjson">Exportar copia JSON</button><button class="btn" id="exportcsv">Exportar CSV</button><label class="btn">Importar copia JSON<input id="importjson" type="file" accept="application/json,.json" hidden></label></div><p>Exporta una copia JSON después de cada sesión. El CSV sirve para hojas de cálculo, pero no conserva todo el historial con la misma fidelidad que JSON.</p></section><section class="panel"><h2>Gestión del proyecto</h2><p>${tasks.length} tareas · ${num(total(tasks,'estimate'))} horas previstas. Puedes crear, editar, mover, borrar y registrar sesiones de cada tarea.</p><button class="btn danger" id="reset">Restablecer planificación inicial</button><p>Esta acción elimina los cambios locales tras confirmación. Descarga una copia antes de usarla.</p></section></div>`}bind()}function bind(){document.querySelectorAll('[data-open]').forEach(e=>e.addEventListener('click',()=>openTask(e.dataset.open)));document.querySelectorAll('.task').forEach(e=>{e.addEventListener('click',()=>openTask(e.dataset.id));e.addEventListener('keydown',ev=>{if(ev.key==='Enter')openTask(e.dataset.id)});e.addEventListener('dragstart',ev=>ev.dataTransfer.setData('text/plain',e.dataset.id))});document.querySelectorAll('[data-lane]').forEach(e=>{e.addEventListener('dragover',ev=>ev.preventDefault());e.addEventListener('drop',ev=>{ev.preventDefault();let t=tasks.find(x=>x.id===ev.dataTransfer.getData('text/plain'));if(t){t.status=e.dataset.lane;t.updated=today();save();render()}})});let q=document.getElementById('q');if(q)q.addEventListener('input',e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)});let c=document.getElementById('cat');if(c)c.onchange=e=>{cat=e.target.value;render()};let p=document.getElementById('priority');if(p)p.onchange=e=>{priority=e.target.value;render()};let cl=document.getElementById('clear');if(cl)cl.onclick=()=>{filter=cat=priority='';render()};let j=document.getElementById('exportjson');if(j)j.onclick=()=>download('asir-control-backup-'+today()+'.json',JSON.stringify({version:2,exported:today(),tasks},null,2),'application/json');let csv=document.getElementById('exportcsv');if(csv)csv.onclick=()=>{let fields=['Title','Description','List/Status','Labels/Category','Priority','Estimated Hours','Actual Hours','Due Date','Notes'];let data=tasks.map(t=>[t.title,t.description,t.status,t.category,t.priority,t.estimate,t.spent,t.due,t.notes]);download('asir-control-'+today()+'.csv','\ufeff'+[fields,...data].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};let im=document.getElementById('importjson');if(im)im.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()),a=Array.isArray(d)?d:d.tasks;if(!Array.isArray(a)||!a.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&STATUSES.includes(t.status)))throw Error('Formato de copia no válido');if(confirm('¿Sustituir todas las tareas actuales por las de la copia?')){tasks=a;save();render()}}catch(err){alert('No se pudo importar: '+err.message)}};let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('¿Restablecer TODAS las tareas y perder cambios locales? Exporta antes una copia JSON.')){tasks=structuredClone(SEED);save();render()}}}function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function openTask(id){let t=tasks.find(x=>x.id===id),fresh=!t;if(!t)t={id:'ASIR-'+Date.now(),title:'',description:'',status:'Backlog',category:categories()[0]||'Planificación y Diseño',priority:'Media',estimate:1,spent:0,due:'',start:'',notes:'',checklist:[],logs:[],created:today(),updated:''};document.getElementById('overlay').innerHTML=`<div class="modalback"><div class="modal"><button class="btn close" id="close">✕ Cerrar</button><div class="eyebrow">${esc(t.id)} · EDITOR DE TAREA</div><h2 style="margin-top:10px">${fresh?'Nueva tarea':'Detalle y seguimiento'}</h2><form id="taskform"><div class="formgrid"><label class="wide">Título<input class="field" name="title" required value="${esc(t.title)}"></label><label class="wide">Descripción y entregables<textarea class="field" name="description" rows="4">${esc(t.description)}</textarea></label><label>Estado<select class="field" name="status">${STATUSES.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Prioridad<select class="field" name="priority">${PRIORITIES.map(s=>`<option ${t.priority===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Categoría<input class="field" name="category" list="categories" value="${esc(t.category)}"><datalist id="categories">${categories().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label><label>Estimación (horas)<input class="field" name="estimate" type="number" min="0" step="0.25" value="${t.estimate}"></label><label>Fecha de inicio<input class="field" name="start" type="date" value="${esc(t.start)}"></label><label>Fecha límite<input class="field" name="due" type="date" value="${esc(t.due)}"></label><label class="wide">Notas de trabajo / incidencias<textarea class="field" name="notes" rows="3">${esc(t.notes)}</textarea></label></div><div class="actions"><button class="btn primary" type="submit">Guardar tarea</button><button class="btn danger" type="button" id="delete">Eliminar tarea</button></div></form><hr style="border:0;border-top:1px solid #30445e;margin:23px 0"><h2>Tiempo real · ${num(t.spent)} h registradas</h2><div class="notice">Registra únicamente horas efectivamente trabajadas. El cronómetro solo se añade al historial cuando confirmas la sesión.</div><div class="actions"><button class="btn" id="timer">${timer&&timerTask===t.id?'Detener cronómetro':'Iniciar cronómetro'}</button><strong id="clock" style="align-self:center">${timer&&timerTask===t.id?'En marcha':'00:00:00'}</strong></div><div class="formgrid" style="margin-top:15px"><label>Fecha de sesión<input class="field" id="logdate" type="date" value="${today()}"></label><label>Horas realizadas<input class="field" id="loghours" type="number" min="0.01" step="0.01" placeholder="Ej. 1.5"></label><label class="wide">Trabajo realizado<input class="field" id="lognote" placeholder="Ej. Configuración de reglas y prueba de conectividad"></label></div><button class="btn" id="addlog" style="margin-top:12px">+ Registrar sesión</button><div id="logs">${(t.logs||[]).slice().reverse().map(l=>`<div class="log">${datefmt(l.date)} · ${num(l.hours)} h · ${esc(l.note||'Sin observaciones')}</div>`).join('')}</div><h2 style="margin-top:24px">Checklist de aceptación</h2><div id="checks">${(t.checklist||[]).map((x,i)=>`<label class="checkrow"><input type="checkbox" data-check="${i}" ${x.done?'checked':''}>${esc(x.text)} <button type="button" class="btn" data-delcheck="${i}" style="margin-left:auto;padding:3px 8px">✕</button></label>`).join('')}</div><div class="actions"><input class="field" id="newcheck" placeholder="Nuevo criterio de aceptación" style="flex:1"><button class="btn" id="addcheck">Añadir criterio</button></div></div></div>`;let root=document.getElementById('overlay');function close(){root.innerHTML='';render()}document.getElementById('close').onclick=close;root.querySelector('.modalback').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))close()});document.getElementById('taskform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);for(let k of ['title','description','status','priority','category','start','due','notes'])t[k]=String(f.get(k)||'').trim();t.estimate=Number(f.get('estimate'))||0;t.updated=today();if(fresh)tasks.push(t);save();close()};document.getElementById('delete').onclick=()=>{if(!fresh&&confirm('¿Eliminar esta tarea y todo su historial?')){tasks=tasks.filter(x=>x.id!==t.id);save();close()}else if(fresh)close()};document.getElementById('addlog').onclick=()=>{if(fresh){alert('Guarda primero la nueva tarea.');return}let h=Number(document.getElementById('loghours').value),date=document.getElementById('logdate').value,note=document.getElementById('lognote').value;if(!(h>0&&h<1000)||!date){alert('Introduce una fecha y horas válidas.');return}t.logs=t.logs||[];t.logs.push({date,hours:h,note});t.spent=Math.round((Number(t.spent||0)+h)*100)/100;t.updated=today();save();openTask(t.id)};document.getElementById('timer').onclick=()=>{if(fresh){alert('Guarda primero la nueva tarea.');return}if(timer){if(timerTask!==t.id){alert('Hay un cronómetro activo en otra tarea.');return}clearInterval(timer);timer=null;let hours=Math.round((Date.now()-started)/36000)/100;document.getElementById('loghours').value=hours;document.getElementById('clock').textContent='Sesión lista: '+hours+' h';document.getElementById('timer').textContent='Iniciar cronómetro';timerTask=''}else{started=Date.now();timerTask=t.id;timer=setInterval(()=>{let sec=Math.floor((Date.now()-started)/1000);let v=[Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(x=>String(x).padStart(2,'0')).join(':');let c=document.getElementById('clock');if(c)c.textContent=v},1000);document.getElementById('timer').textContent='Detener cronómetro'}};root.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{t.checklist[Number(e.dataset.check)].done=e.checked;save()});root.querySelectorAll('[data-delcheck]').forEach(e=>e.onclick=()=>{t.checklist.splice(Number(e.dataset.delcheck),1);save();openTask(t.id)});document.getElementById('addcheck').onclick=()=>{if(fresh){alert('Guarda primero la nueva tarea.');return}let v=document.getElementById('newcheck').value.trim();if(v){t.checklist=t.checklist||[];t.checklist.push({text:v,done:false});save();openTask(t.id)}}}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('add').onclick=()=>openTask(null);render();</script></body></html>
